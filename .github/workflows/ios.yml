name: iOS • Build, test & package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: iOS simulator checks & unsigned IPA
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Validate community boundaries and project
        run: |
          python3 scripts/icons.py
          python3 scripts/validate.py
          xcodegen generate
      - name: Choose simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in sorted(d["devices"].items(),reverse=True) if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Boot simulator
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
      - name: Simulator unit and interface tests
        run: |
          set -o pipefail
          xcodebuild test -project Panel.xcodeproj -scheme Panel -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS=Config/Simulator.entitlements -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 | tee simulator.log
      - name: Build iPhone and iPad app
        run: |
          set -o pipefail
          xcodebuild build -project Panel.xcodeproj -scheme Panel -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' | tee device.log
      - name: Package and verify
        run: |
          mkdir -p build/export/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Panel.app build/export/Payload/
          test -f build/export/Payload/Panel.app/PlugIns/PanelWidgets.appex/PanelWidgets
          xcrun lipo build/export/Payload/Panel.app/Panel -verify_arch arm64
          plutil -lint build/export/Payload/Panel.app/Info.plist
          cd build/export
          zip -qry Simplex-Wing-1.0.0-unsigned.ipa Payload
          unzip -t Simplex-Wing-1.0.0-unsigned.ipa
          shasum -a 256 Simplex-Wing-1.0.0-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Simplex-Wing-unsigned-IPA
          path: |
            build/export/*.ipa
            build/export/SHA256SUMS.txt
          if-no-files-found: error
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun simctl spawn booted log show --last 15m --style compact --predicate 'process == "Panel"' > app-runtime.log 2>&1 || true
          if [ -d build/Tests.xcresult ]; then xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: |
            build/Tests.xcresult
            build/screenshots
            simulator.log
            device.log
            app-runtime.log
          retention-days: 14
  release:
    name: Publish verified community build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Simplex-Wing-unsigned-IPA
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 *.ipa SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Simplex Wing 1.0.0' --notes-file ../docs/RELEASE.md
          fi
