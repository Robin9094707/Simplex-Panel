name: Bug report
description: Report a reproducible problem without credentials or sensitive logs.
body:
  - type: input
    id: version
    attributes:
      label: App version and iOS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Remove API keys, URLs with tokens and private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Panel version, signing tool and relevant permissions
