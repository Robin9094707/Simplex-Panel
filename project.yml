name: Panel
options:
  bundleIdPrefix: eu.simplexsmp.wing
  developmentLanguage: en
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Simplex Wing
    INFOPLIST_KEY_CFBundleDevelopmentRegion: en
    INFOPLIST_KEY_CFBundleLocalizations: 'en de'
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your saved panel connections.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Panel:
    type: application
    platform: iOS
    sources: [Panel, Shared]
    dependencies:
      - target: PanelWidgets
        embed: true
    info:
      path: Config/PanelInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: eu.simplexsmp.wing
            CFBundleURLSchemes: [simplexwing]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.wing
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: ServerIcon AmethystIcon
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      CODE_SIGN_ENTITLEMENTS: Config/Panel.entitlements
      INFOPLIST_KEY_NSSupportsLiveActivities: YES
      OTHER_LDFLAGS: '$(inherited) -lz'
  PanelWidgets:
    type: app-extension
    platform: iOS
    sources: [PanelWidgets, Shared]
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Simplex Wing Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.wing.widgets
      CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: ''
      APPLICATION_EXTENSION_API_ONLY: YES
      SKIP_INSTALL: YES
  PanelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PanelTests]
    dependencies:
      - target: Panel
  PanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PanelUITests]
    dependencies:
      - target: Panel
schemes:
  Panel:
    build:
      targets:
        Panel: all
    test:
      targets: [PanelTests, PanelUITests]
